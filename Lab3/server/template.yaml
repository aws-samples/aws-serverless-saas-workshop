AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Lab3 - Lambda functions and API Gateway
Parameters:
  StageName:
    Type: String
    Default: "prod"
    Description: "Stage Name for the api"
Resources:
  LambdaFunctions:
    Type: AWS::Serverless::Application
    Properties:
      Location: nested_templates/lambdafunctions.yaml
      Parameters:
        CognitoUserPoolId: !ImportValue Serverless-SaaS-CognitoUserPoolId
        CognitoUserPoolClientId: !ImportValue Serverless-SaaS-CognitoUserPoolClientId
        CognitoOperationUsersUserPoolId: !ImportValue Serverless-SaaS-CognitoOperationUsersUserPoolId
        CognitoOperationUsersUserPoolClientId: !ImportValue Serverless-SaaS-CognitoOperationUsersUserPoolClientId

  APIs:
    Type: AWS::Serverless::Application
    DependsOn: LambdaFunctions
    Properties:
      Location: nested_templates/apigateway.yaml
      Parameters:
        StageName: !Ref StageName
        RegisterTenantLambdaExecutionRoleArn: !GetAtt LambdaFunctions.Outputs.RegisterTenantLambdaExecutionRoleArn
        TenantManagementLambdaExecutionRoleArn: !GetAtt LambdaFunctions.Outputs.TenantManagementLambdaExecutionRoleArn
        RegisterTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.RegisterTenantFunctionArn
        ActivateTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.ActivateTenantFunctionArn
        GetTenantsFunctionArn: !GetAtt LambdaFunctions.Outputs.GetTenantsFunctionArn
        CreateTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateTenantFunctionArn
        GetTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.GetTenantFunctionArn
        DeactivateTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.DeactivateTenantFunctionArn
        UpdateTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.UpdateTenantFunctionArn
        GetUsersFunctionArn: !GetAtt LambdaFunctions.Outputs.GetUsersFunctionArn
        GetUserFunctionArn: !GetAtt LambdaFunctions.Outputs.GetUserFunctionArn
        UpdateUserFunctionArn: !GetAtt LambdaFunctions.Outputs.UpdateUserFunctionArn
        DisableUserFunctionArn: !GetAtt LambdaFunctions.Outputs.DisableUserFunctionArn
        CreateTenantAdminUserFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateTenantAdminUserFunctionArn
        CreateUserFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateUserFunctionArn
        DisableUsersByTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.DisableUsersByTenantFunctionArn
        EnableUsersByTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.EnableUsersByTenantFunctionArn
        AuthorizerFunctionArn: !GetAtt LambdaFunctions.Outputs.SharedServicesAuthorizerFunctionArn
        BusinessServicesAuthorizerFunctionArn: !GetAtt LambdaFunctions.Outputs.BusinessServicesAuthorizerFunctionArn
        GetProductFunctionArn: !GetAtt LambdaFunctions.Outputs.GetProductFunctionArn
        GetProductsFunctionArn: !GetAtt LambdaFunctions.Outputs.GetProductsFunctionArn
        CreateProductFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateProductFunctionArn
        UpdateProductFunctionArn: !GetAtt LambdaFunctions.Outputs.UpdateProductFunctionArn
        DeleteProductFunctionArn: !GetAtt LambdaFunctions.Outputs.DeleteProductFunctionArn
        GetOrdersFunctionArn: !GetAtt LambdaFunctions.Outputs.GetOrdersFunctionArn
        GetOrderFunctionArn: !GetAtt LambdaFunctions.Outputs.GetOrderFunctionArn
        CreateOrderFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateOrderFunctionArn
        UpdateOrderFunctionArn: !GetAtt LambdaFunctions.Outputs.UpdateOrderFunctionArn
        DeleteOrderFunctionArn: !GetAtt LambdaFunctions.Outputs.DeleteOrderFunctionArn

  APIGatewayLambdaPermissions:
    Type: AWS::Serverless::Application
    DependsOn: LambdaFunctions
    Properties:
      Location: nested_templates/apigateway_lambdapermissions.yaml
      Parameters:
        RegisterTenantLambdaExecutionRoleArn: !GetAtt LambdaFunctions.Outputs.RegisterTenantLambdaExecutionRoleArn
        TenantManagementLambdaExecutionRoleArn: !GetAtt LambdaFunctions.Outputs.TenantManagementLambdaExecutionRoleArn
        RegisterTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.RegisterTenantFunctionArn
        ActivateTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.ActivateTenantFunctionArn
        GetTenantsFunctionArn: !GetAtt LambdaFunctions.Outputs.GetTenantsFunctionArn
        CreateTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateTenantFunctionArn
        GetTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.GetTenantFunctionArn
        DeactivateTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.DeactivateTenantFunctionArn
        UpdateTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.UpdateTenantFunctionArn
        GetUsersFunctionArn: !GetAtt LambdaFunctions.Outputs.GetUsersFunctionArn
        GetUserFunctionArn: !GetAtt LambdaFunctions.Outputs.GetUserFunctionArn
        UpdateUserFunctionArn: !GetAtt LambdaFunctions.Outputs.UpdateUserFunctionArn
        DisableUserFunctionArn: !GetAtt LambdaFunctions.Outputs.DisableUserFunctionArn
        CreateTenantAdminUserFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateTenantAdminUserFunctionArn
        CreateUserFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateUserFunctionArn
        DisableUsersByTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.DisableUsersByTenantFunctionArn
        EnableUsersByTenantFunctionArn: !GetAtt LambdaFunctions.Outputs.EnableUsersByTenantFunctionArn
        AuthorizerFunctionArn: !GetAtt LambdaFunctions.Outputs.SharedServicesAuthorizerFunctionArn
        AdminApiGatewayApi: !GetAtt APIs.Outputs.AdminApiGatewayApi
        BusinessServicesAuthorizerFunctionArn: !GetAtt LambdaFunctions.Outputs.BusinessServicesAuthorizerFunctionArn
        GetProductFunctionArn: !GetAtt LambdaFunctions.Outputs.GetProductFunctionArn
        GetProductsFunctionArn: !GetAtt LambdaFunctions.Outputs.GetProductsFunctionArn
        CreateProductFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateProductFunctionArn
        UpdateProductFunctionArn: !GetAtt LambdaFunctions.Outputs.UpdateProductFunctionArn
        DeleteProductFunctionArn: !GetAtt LambdaFunctions.Outputs.DeleteProductFunctionArn
        GetOrdersFunctionArn: !GetAtt LambdaFunctions.Outputs.GetOrdersFunctionArn
        GetOrderFunctionArn: !GetAtt LambdaFunctions.Outputs.GetOrderFunctionArn
        CreateOrderFunctionArn: !GetAtt LambdaFunctions.Outputs.CreateOrderFunctionArn
        UpdateOrderFunctionArn: !GetAtt LambdaFunctions.Outputs.UpdateOrderFunctionArn
        DeleteOrderFunctionArn: !GetAtt LambdaFunctions.Outputs.DeleteOrderFunctionArn
        ApplicationApiGatewayApi: !GetAtt APIs.Outputs.ApplicationApiGatewayApi

Outputs:
  AdminApi:
    Description: "API Gateway endpoint URL for Admin API"
    Value: !Join ["", ["https://", !GetAtt APIs.Outputs.AdminApiGatewayApi, ".execute-api.", !Ref "AWS::Region", ".amazonaws.com/", !Ref StageName]]
  APIGatewayURL:
    Description: "API Gateway endpoint URL for Application API"
    Value: !Join ["", ["https://", !GetAtt APIs.Outputs.ApplicationApiGatewayApi, ".execute-api.", !Ref "AWS::Region", ".amazonaws.com/", !Ref StageName]]
  AdminSiteBucket:
    Value: !ImportValue Serverless-SaaS-AdminSiteBucket
  AdminAppSite:
    Value: !ImportValue Serverless-SaaS-AdminAppSite
  LandingApplicationSiteBucket:
    Value: !ImportValue Serverless-SaaS-LandingApplicationSiteBucket
  LandingApplicationSite:
    Value: !ImportValue Serverless-SaaS-LandingApplicationSite
  ApplicationSiteBucket:
    Value: !ImportValue Serverless-SaaS-ApplicationSiteBucket
  ApplicationSite:
    Value: !ImportValue Serverless-SaaS-ApplicationSite
  CognitoOperationUsersUserPoolClientId:
    Value: !ImportValue Serverless-SaaS-CognitoOperationUsersUserPoolClientId
  CognitoTenantUserPoolId:
    Value: !ImportValue Serverless-SaaS-CognitoUserPoolId
    Export:
      Name: "Serverless-SaaS-CognitoTenantUserPoolId"
  CognitoTenantAppClientId:
    Value: !ImportValue Serverless-SaaS-CognitoUserPoolClientId
    Export:
      Name: "Serverless-SaaS-CognitoTenantAppClientId"
