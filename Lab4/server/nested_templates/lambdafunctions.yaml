AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Template to deploy lambda functions as part of bootstrap
Parameters:
  CognitoOperationUsersUserPoolId:
    Type: String
  CognitoOperationUsersUserPoolClientId:
    Type: String
  CognitoUserPoolId:
    Type: String
  CognitoUserPoolClientId:
    Type: String
Globals:
  Function:
    Timeout: 29
    Layers:
      - !Sub "arn:aws:lambda:${AWS::Region}:580247275435:layer:LambdaInsightsExtension:14"
    Environment:
      Variables:
        LOG_LEVEL: DEBUG
        POWERTOOLS_METRICS_NAMESPACE: "ServerlessSaaS"

Resources:

  # ==================== Lambda Layer ====================
  ServerlessSaaSLayers:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: serverless-saas-dependencies
      Description: Shared dependencies for Serverless SaaS Workshop
      ContentUri: ../layers/
      CompatibleRuntimes:
        - python3.14
      LicenseInfo: MIT
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.14

  SharedServicesAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../Resources/
      Handler: shared_service_authorizer.lambda_handler
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-AuthorizerExecutionRoleArn
      MemorySize: 256
      Tracing: Active
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          OPERATION_USERS_USER_POOL: !Ref CognitoOperationUsersUserPoolId
          OPERATION_USERS_APP_CLIENT: !Ref CognitoOperationUsersUserPoolClientId

  CreateTenantAdminUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: user-management.create_tenant_admin_user
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-CreateUserLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref CognitoUserPoolId
          TENANT_APP_CLIENT_ID: !Ref CognitoUserPoolClientId
          POWERTOOLS_SERVICE_NAME: "UserManagement.CreateTenantAdmin"

  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: user-management.create_user
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-CreateUserLambdaExecutionRoleArn
      Tracing: Active
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref CognitoUserPoolId
          POWERTOOLS_SERVICE_NAME: "UserManagement.CreateUser"

  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: user-management.update_user
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantUserPoolLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref CognitoUserPoolId
          POWERTOOLS_SERVICE_NAME: "UserManagement.UpdateUser"

  DisableUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: user-management.disable_user
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantUserPoolLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref CognitoUserPoolId
          POWERTOOLS_SERVICE_NAME: "UserManagement.DisableUser"

  DisableUsersByTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: user-management.disable_users_by_tenant
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantUserPoolLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref CognitoUserPoolId
          POWERTOOLS_SERVICE_NAME: "UserManagement.DisableUsersByTenant"

  EnableUsersByTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: user-management.enable_users_by_tenant
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantUserPoolLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref CognitoUserPoolId
          POWERTOOLS_SERVICE_NAME: "UserManagement.EnableUsersByTenant"

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: user-management.get_user
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantUserPoolLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref CognitoUserPoolId
          POWERTOOLS_SERVICE_NAME: "UserManagement.GetUser"

  GetUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: user-management.get_users
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantUserPoolLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref CognitoUserPoolId
          POWERTOOLS_SERVICE_NAME: "UserManagement.GetUsers"

  CreateTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: tenant-management.create_tenant
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantManagementLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "TenantManagement.CreateTenant"

  ActivateTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: tenant-management.activate_tenant
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantManagementLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "TenantManagement.ActivateTenant"
          ENABLE_USERS_BY_TENANT: "/users/enable"
          PROVISION_TENANT: "/provisioning/"

  GetTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: tenant-management.get_tenant
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantManagementLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "TenantManagement.GetTenant"

  DeactivateTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: tenant-management.deactivate_tenant
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantManagementLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "TenantManagement.DeactivateTenant"
          DEPROVISION_TENANT: "/provisioning/"
          DISABLE_USERS_BY_TENANT: "/users/disable"

  UpdateTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: tenant-management.update_tenant
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantManagementLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "TenantManagement.UpdateTenant"

  GetTenantsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: tenant-management.get_tenants
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-TenantManagementLambdaExecutionRoleArn
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Layers:
        - !Ref ServerlessSaaSLayers

  RegisterTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../TenantManagementService/
      Handler: tenant-registration.register_tenant
      Runtime: python3.14
      Role: !ImportValue Serverless-SaaS-RegisterTenantLambdaExecutionRoleArn
      Tracing: Active
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          CREATE_TENANT_ADMIN_USER_RESOURCE_PATH: "/user/tenant-admin"
          CREATE_TENANT_RESOURCE_PATH: "/tenant"
          PROVISION_TENANT_RESOURCE_PATH: "/provisioning"
          POWERTOOLS_SERVICE_NAME: "TenantRegistration.RegisterTenant"

  # ==================== Product/Order Resources (Multi-Tenant) ====================
  ProductTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: shardId
          AttributeType: S
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: shardId
          KeyType: HASH
        - AttributeName: productId
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      TableName: Product-pooled

  OrderTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: shardId
          AttributeType: S
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: shardId
          KeyType: HASH
        - AttributeName: orderId
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      TableName: Order-pooled

  ProductFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pooled-product-function-execution-role
      Path: '/'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      Policies:
        - PolicyName: pooled-product-function-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ProductTable.Arn

  OrderFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pooled-order-function-execution-role
      Path: '/'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      Policies:
        - PolicyName: pooled-order-function-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt OrderTable.Arn

  TenantAuthorizerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tenant-authorizer-execution-role
      Path: '/'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      Policies:
        - PolicyName: tenant-authorizer-execution-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:List*
                Resource:
                  - !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  BusinessServicesAuthorizerFunction:
    Type: AWS::Serverless::Function
    DependsOn: TenantAuthorizerExecutionRole
    Properties:
      CodeUri: ../Resources/
      Handler: tenant_authorizer.lambda_handler
      Runtime: python3.14
      Role: !GetAtt TenantAuthorizerExecutionRole.Arn
      MemorySize: 256
      Tracing: Active
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          TENANT_USER_POOL: !ImportValue Serverless-SaaS-CognitoUserPoolId
          TENANT_APP_CLIENT: !ImportValue Serverless-SaaS-CognitoUserPoolClientId

  GetProductFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProductFunctionExecutionRole
    Properties:
      CodeUri: ../ProductService/
      Handler: product_service.get_product
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt ProductFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "ProductService"
          PRODUCT_TABLE_NAME: !Ref ProductTable

  GetProductsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProductFunctionExecutionRole
    Properties:
      CodeUri: ../ProductService/
      Handler: product_service.get_products
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt ProductFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "ProductService"
          PRODUCT_TABLE_NAME: !Ref ProductTable

  CreateProductFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProductFunctionExecutionRole
    Properties:
      CodeUri: ../ProductService/
      Handler: product_service.create_product
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt ProductFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "ProductService"
          PRODUCT_TABLE_NAME: !Ref ProductTable

  UpdateProductFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProductFunctionExecutionRole
    Properties:
      CodeUri: ../ProductService/
      Handler: product_service.update_product
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt ProductFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "ProductService"
          PRODUCT_TABLE_NAME: !Ref ProductTable

  DeleteProductFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProductFunctionExecutionRole
    Properties:
      CodeUri: ../ProductService/
      Handler: product_service.delete_product
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt ProductFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "ProductService"
          PRODUCT_TABLE_NAME: !Ref ProductTable

  GetOrdersFunction:
    Type: AWS::Serverless::Function
    DependsOn: OrderFunctionExecutionRole
    Properties:
      CodeUri: ../OrderService/
      Handler: order_service.get_orders
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt OrderFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "OrderService"
          ORDER_TABLE_NAME: !Ref OrderTable

  GetOrderFunction:
    Type: AWS::Serverless::Function
    DependsOn: OrderFunctionExecutionRole
    Properties:
      CodeUri: ../OrderService/
      Handler: order_service.get_order
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt OrderFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "OrderService"
          ORDER_TABLE_NAME: !Ref OrderTable

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    DependsOn: OrderFunctionExecutionRole
    Properties:
      CodeUri: ../OrderService/
      Handler: order_service.create_order
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt OrderFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "OrderService"
          ORDER_TABLE_NAME: !Ref OrderTable

  UpdateOrderFunction:
    Type: AWS::Serverless::Function
    DependsOn: OrderFunctionExecutionRole
    Properties:
      CodeUri: ../OrderService/
      Handler: order_service.update_order
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt OrderFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "OrderService"
          ORDER_TABLE_NAME: !Ref OrderTable

  DeleteOrderFunction:
    Type: AWS::Serverless::Function
    DependsOn: OrderFunctionExecutionRole
    Properties:
      CodeUri: ../OrderService/
      Handler: order_service.delete_order
      Runtime: python3.14
      Tracing: Active
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      Role: !GetAtt OrderFunctionExecutionRole.Arn
      Layers:
        - !Ref ServerlessSaaSLayers
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: "OrderService"
          ORDER_TABLE_NAME: !Ref OrderTable

Outputs:
  RegisterTenantLambdaExecutionRoleArn:
    Value: !ImportValue Serverless-SaaS-RegisterTenantLambdaExecutionRoleArn
  TenantManagementLambdaExecutionRoleArn:
    Value: !ImportValue Serverless-SaaS-TenantManagementLambdaExecutionRoleArn
  RegisterTenantFunctionArn:
    Value: !GetAtt RegisterTenantFunction.Arn
  ActivateTenantFunctionArn:
    Value: !GetAtt ActivateTenantFunction.Arn
  GetTenantsFunctionArn:
    Value: !GetAtt GetTenantsFunction.Arn
  CreateTenantFunctionArn:
    Value: !GetAtt CreateTenantFunction.Arn
  GetTenantFunctionArn:
    Value: !GetAtt GetTenantFunction.Arn
  DeactivateTenantFunctionArn:
    Value: !GetAtt DeactivateTenantFunction.Arn
  UpdateTenantFunctionArn:
    Value: !GetAtt UpdateTenantFunction.Arn
  GetUsersFunctionArn:
    Value: !GetAtt GetUsersFunction.Arn
  GetUserFunctionArn:
    Value: !GetAtt GetUserFunction.Arn
  UpdateUserFunctionArn:
    Value: !GetAtt UpdateUserFunction.Arn
  DisableUserFunctionArn:
    Value: !GetAtt DisableUserFunction.Arn
  CreateTenantAdminUserFunctionArn:
    Value: !GetAtt CreateTenantAdminUserFunction.Arn
  CreateUserFunctionArn:
    Value: !GetAtt CreateUserFunction.Arn
  DisableUsersByTenantFunctionArn:
    Value: !GetAtt DisableUsersByTenantFunction.Arn
  EnableUsersByTenantFunctionArn:
    Value: !GetAtt EnableUsersByTenantFunction.Arn
  SharedServicesAuthorizerFunctionArn:
    Value: !GetAtt SharedServicesAuthorizerFunction.Arn
  BusinessServicesAuthorizerFunctionArn:
    Value: !GetAtt BusinessServicesAuthorizerFunction.Arn
  GetProductFunctionArn:
    Value: !GetAtt GetProductFunction.Arn
  GetProductsFunctionArn:
    Value: !GetAtt GetProductsFunction.Arn
  CreateProductFunctionArn:
    Value: !GetAtt CreateProductFunction.Arn
  UpdateProductFunctionArn:
    Value: !GetAtt UpdateProductFunction.Arn
  DeleteProductFunctionArn:
    Value: !GetAtt DeleteProductFunction.Arn
  GetOrdersFunctionArn:
    Value: !GetAtt GetOrdersFunction.Arn
  GetOrderFunctionArn:
    Value: !GetAtt GetOrderFunction.Arn
  CreateOrderFunctionArn:
    Value: !GetAtt CreateOrderFunction.Arn
  UpdateOrderFunctionArn:
    Value: !GetAtt UpdateOrderFunction.Arn
  DeleteOrderFunctionArn:
    Value: !GetAtt DeleteOrderFunction.Arn
