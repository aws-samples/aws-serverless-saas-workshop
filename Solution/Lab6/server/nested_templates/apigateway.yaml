AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Template to setup api gateway routes on the pre-existing API from shared stack
Parameters:
  StageName:
    Type: String
  RegisterTenantLambdaExecutionRoleArn:
    Type: String
  TenantManagementLambdaExecutionRoleArn:
    Type: String
  RegisterTenantFunctionArn:
    Type: String
  ProvisionTenantFunctionArn:
    Type: String
  DeProvisionTenantFunctionArn:
    Type: String
  ActivateTenantFunctionArn:
    Type: String
  GetTenantsFunctionArn:
    Type: String
  GetTenantConfigFunctionArn:
    Type: String
  CreateTenantFunctionArn:
    Type: String
  GetTenantFunctionArn:
    Type: String
  DeactivateTenantFunctionArn:
    Type: String
  UpdateTenantFunctionArn:
    Type: String
  GetUsersFunctionArn:
    Type: String
  GetUserFunctionArn:
    Type: String
  UpdateUserFunctionArn:
    Type: String
  DisableUserFunctionArn:
    Type: String
  CreateTenantAdminUserFunctionArn:
    Type: String
  CreateUserFunctionArn:
    Type: String
  DisableUsersByTenantFunctionArn:
    Type: String
  EnableUsersByTenantFunctionArn:
    Type: String
  AuthorizerFunctionArn:
    Type: String
  ApiKeyOperationUsersParameter:
    Type: String
  ApiKeyPlatinumTierParameter:
    Type: String
  ApiKeyPremiumTierParameter:
    Type: String
  ApiKeyStandardTierParameter:
    Type: String
  ApiKeyBasicTierParameter:
    Type: String

Resources:
  AdminApiGatewayAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/api-gateway/access-logs-serverless-saas-admin-api
      RetentionInDays: 30

  Authorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: SharedServicesAuthorizer
      Type: TOKEN
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunctionArn}/invocations"
      AuthorizerResultTtlInSeconds: 60
      IdentitySource: method.request.header.Authorization
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId

  # ==================== API Resources ====================
  RegistrationResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !ImportValue Serverless-SaaS-AdminApiGatewayRootResourceId
      PathPart: registration

  ProvisioningResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !ImportValue Serverless-SaaS-AdminApiGatewayRootResourceId
      PathPart: provisioning

  ProvisioningIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref ProvisioningResource
      PathPart: "{tenantid}"

  TenantResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !ImportValue Serverless-SaaS-AdminApiGatewayRootResourceId
      PathPart: tenant

  TenantIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref TenantResource
      PathPart: "{tenantid}"

  TenantActivationResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref TenantResource
      PathPart: activation

  TenantActivationIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref TenantActivationResource
      PathPart: "{tenantid}"

  TenantInitResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref TenantResource
      PathPart: init

  TenantInitNameResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref TenantInitResource
      PathPart: "{tenantname}"

  TenantsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !ImportValue Serverless-SaaS-AdminApiGatewayRootResourceId
      PathPart: tenants

  UserResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !ImportValue Serverless-SaaS-AdminApiGatewayRootResourceId
      PathPart: user

  UserNameResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref UserResource
      PathPart: "{username}"

  UserTenantAdminResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref UserResource
      PathPart: tenant-admin

  UsersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !ImportValue Serverless-SaaS-AdminApiGatewayRootResourceId
      PathPart: users

  UsersDisableResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref UsersResource
      PathPart: disable

  UsersEnableResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ParentId: !Ref UsersResource
      PathPart: enable

  # ==================== Methods ====================
  RegistrationPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref RegistrationResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterTenantFunctionArn}/invocations"

  ProvisioningPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref ProvisioningResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProvisionTenantFunctionArn}/invocations"

  ProvisioningDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref ProvisioningIdResource
      HttpMethod: DELETE
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeProvisionTenantFunctionArn}/invocations"

  TenantActivationPut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref TenantActivationIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ActivateTenantFunctionArn}/invocations"

  TenantsGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref TenantsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTenantsFunctionArn}/invocations"

  TenantPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref TenantResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTenantFunctionArn}/invocations"

  TenantInitGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref TenantInitNameResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTenantConfigFunctionArn}/invocations"

  TenantIdGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref TenantIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTenantFunctionArn}/invocations"

  TenantIdDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref TenantIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeactivateTenantFunctionArn}/invocations"

  TenantIdPut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref TenantIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateTenantFunctionArn}/invocations"

  UserNameGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref UserNameResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUserFunctionArn}/invocations"

  UserNamePut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref UserNameResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateUserFunctionArn}/invocations"

  UserNameDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref UserNameResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisableUserFunctionArn}/invocations"

  UserTenantAdminPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref UserTenantAdminResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTenantAdminUserFunctionArn}/invocations"

  UserPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref UserResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateUserFunctionArn}/invocations"

  UsersGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref UsersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref Authorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUsersFunctionArn}/invocations"

  UsersDisablePut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref UsersDisableResource
      HttpMethod: PUT
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisableUsersByTenantFunctionArn}/invocations"
        RequestParameters:
          integration.request.header.X-Amz-Invocation-Type: "'Event'"
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  UsersEnablePut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      ResourceId: !Ref UsersEnableResource
      HttpMethod: PUT
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EnableUsersByTenantFunctionArn}/invocations"
        RequestParameters:
          integration.request.header.X-Amz-Invocation-Type: "'Event'"
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # ==================== Deployment ====================
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - RegistrationPost
      - ProvisioningPost
      - ProvisioningDelete
      - TenantActivationPut
      - TenantsGet
      - TenantPost
      - TenantInitGet
      - TenantIdGet
      - TenantIdDelete
      - TenantIdPut
      - UserNameGet
      - UserNamePut
      - UserNameDelete
      - UserTenantAdminPost
      - UserPost
      - UsersGet
      - UsersDisablePut
      - UsersEnablePut
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref StageName
      AccessLogSetting:
        DestinationArn: !GetAtt AdminApiGatewayAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      MethodSettings:
        - DataTraceEnabled: false
          LoggingLevel: INFO
          MetricsEnabled: true
          ResourcePath: "/*"
          HttpMethod: "*"
      TracingEnabled: true

  # ==================== API Keys ====================
  APIGatewayApiKeySystemAdmin:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Description: "API key for system admin"
      Enabled: true
      Name: Serverless-SaaS-SysAdmin-ApiKey
      Value: !Ref ApiKeyOperationUsersParameter

  APIGatewayApiKeyPlatinumTier:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Description: "API key for platinum tier tenants"
      Enabled: true
      Name: Serverless-SaaS-PlatinumTier-ApiKey
      Value: !Ref ApiKeyPlatinumTierParameter

  APIGatewayApiKeyPremiumTier:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Description: "API key for premium tier tenants"
      Enabled: true
      Name: Serverless-SaaS-PremiumTier-ApiKey
      Value: !Ref ApiKeyPremiumTierParameter

  APIGatewayApiKeyStandardTier:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Description: "API key for standard tier tenants"
      Enabled: true
      Name: Serverless-SaaS-StandardTier-ApiKey
      Value: !Ref ApiKeyStandardTierParameter

  APIGatewayApiKeyBasicTier:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Description: "API key for basic tier tenants"
      Enabled: true
      Name: Serverless-SaaS-BasicTier-ApiKey
      Value: !Ref ApiKeyBasicTierParameter

  # ==================== Usage Plans ====================
  UsagePlanPlatinumTier:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      ApiStages:
        - ApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
          Stage: !Ref StageName
      Description: Usage plan for platinum tier tenants
      Quota:
        Limit: 10000
        Period: DAY
      Throttle:
        BurstLimit: 300
        RateLimit: 300
      UsagePlanName: Plan_Platinum_Tier

  UsagePlanPremiumTier:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      ApiStages:
        - ApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
          Stage: !Ref StageName
      Description: Usage plan for premium tier tenants
      Quota:
        Limit: 5000
        Period: DAY
      Throttle:
        BurstLimit: 200
        RateLimit: 100
      UsagePlanName: Plan_Premium_Tier

  UsagePlanStandardTier:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      ApiStages:
        - ApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
          Stage: !Ref StageName
      Description: Usage plan for standard tier tenants
      Quota:
        Limit: 3000
        Period: DAY
      Throttle:
        BurstLimit: 100
        RateLimit: 75
      UsagePlanName: Plan_Standard_Tier

  UsagePlanBasicTier:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      ApiStages:
        - ApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
          Stage: !Ref StageName
      Description: Usage plan for basic tier tenants
      Quota:
        Limit: 500
        Period: DAY
      Throttle:
        BurstLimit: 50
        RateLimit: 50
      UsagePlanName: Plan_Basic_Tier

  UsagePlanSystemAdmin:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      ApiStages:
        - ApiId: !ImportValue Serverless-SaaS-AdminApiGatewayId
          Stage: !Ref StageName
      Description: Usage plan for system admin
      Quota:
        Limit: 10000
        Period: DAY
      Throttle:
        BurstLimit: 5000
        RateLimit: 500
      UsagePlanName: System_Admin_Usage_Plan

  # ==================== Usage Plan Key Associations ====================
  AssociateAPIKeyToUsagePlan:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref APIGatewayApiKeySystemAdmin
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanSystemAdmin

  AssociatePlatinumAPIKeyToUsagePlan:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref APIGatewayApiKeyPlatinumTier
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanPlatinumTier

  AssociatePremiumAPIKeyToUsagePlan:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref APIGatewayApiKeyPremiumTier
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanPremiumTier

  AssociateStandardAPIKeyToUsagePlan:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref APIGatewayApiKeyStandardTier
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanStandardTier

  AssociateBasicAPIKeyToUsagePlan:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref APIGatewayApiKeyBasicTier
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanBasicTier

Outputs:
  AdminApiGatewayApi:
    Value: !ImportValue Serverless-SaaS-AdminApiGatewayId
  UsagePlanBasicTier:
    Value: !Ref UsagePlanBasicTier
  UsagePlanStandardTier:
    Value: !Ref UsagePlanStandardTier
  UsagePlanPremiumTier:
    Value: !Ref UsagePlanPremiumTier
  UsagePlanPlatinumTier:
    Value: !Ref UsagePlanPlatinumTier
